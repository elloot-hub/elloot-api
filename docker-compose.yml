services:
  postgres:
    image: postgres:16-alpine
    container_name: elloot-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: elloot
    volumes:
      - elloot_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    container_name: elloot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - elloot_redis_data:/data

volumes:image.png
  elloot_pg_data:
  elloot_redis_data:
