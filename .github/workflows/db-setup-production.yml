name: DB Setup Production

# One-shot: prisma db push + db:secure + seed against Square Cloud Postgres.
# Required secrets (Settings → Actions):
#   DATABASE_URL          — connection string (no SSL query params needed)
#   DATABASE_SSL_CERT     — full contents of certificate.pem from Square dashboard
# Optional:
#   DATABASE_SSL_P12_PASSWORD — default elloot

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require DB secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL_CERT: ${{ secrets.DATABASE_SSL_CERT }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$DATABASE_SSL_CERT" ]; then
            echo "::error::Configure secrets DATABASE_URL and DATABASE_SSL_CERT, then re-run."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Write SSL cert
        env:
          DATABASE_SSL_CERT: ${{ secrets.DATABASE_SSL_CERT }}
        run: |
          mkdir -p src/databases/postgres/certificates
          # Preserve PEM newlines; do not trim or reformat key/cert blocks.
          printf '%s\n' "$DATABASE_SSL_CERT" > src/databases/postgres/certificates/certificate.pem
          if ! grep -q "BEGIN PRIVATE KEY\|BEGIN CERTIFICATE\|BEGIN RSA PRIVATE KEY" \
            src/databases/postgres/certificates/certificate.pem; then
            echo "::error::DATABASE_SSL_CERT must be the full certificate.pem (PRIVATE KEY + CERTIFICATE)."
            exit 1
          fi

      - name: Normalize DATABASE_URL
        id: dburl
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node <<'NODE'
          const raw = process.env.DATABASE_URL || "";
          let u;
          try {
            u = new URL(raw);
          } catch {
            console.error("::error::DATABASE_URL is not a valid URL");
            process.exit(1);
          }
          const host = u.hostname;
          let db = u.pathname.replace(/^\//, "").split("?")[0] || "";
          // Square Cloud managed Postgres app DB is usually "squarecloud", not "postgres".
          if (host.includes("squareweb.app") && (db === "postgres" || db === "")) {
            console.warn(`Rewriting database path "/${db || ""}" → "/squarecloud" for ${host}`);
            db = "squarecloud";
            u.pathname = "/squarecloud";
          }
          console.log(`DB target user=${u.username} host=${host} port=${u.port} db=${db}`);
          if (!db || db === "postgres") {
            console.error(
              "::error::DATABASE_URL must use the app database name from Square (e.g. /squarecloud), not /postgres.",
            );
            process.exit(1);
          }
          const fs = require("fs");
          const next = u.toString();
          fs.appendFileSync(
            process.env.GITHUB_ENV,
            `DATABASE_URL<<EOF\n${next}\nEOF\n`,
          );
          NODE

      - name: Ensure public schema privileges
        env:
          NODE_ENV: development
          DATABASE_SSL_CERT_PATH: ./src/databases/postgres/certificates/certificate.pem
          DATABASE_SSL_P12_PASSWORD: ${{ secrets.DATABASE_SSL_P12_PASSWORD || 'elloot' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-placeholder-jwt-secret-at-least-32-chars' }}
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET || 'ci-placeholder-admin-jwt-secret-32ch' }}
        run: npx tsx scripts/ensure-public-schema.ts

      - name: Prisma db push
        continue-on-error: true
        env:
          NODE_ENV: development
          DATABASE_SSL_CERT_PATH: ./src/databases/postgres/certificates/certificate.pem
          DATABASE_SSL_P12_PASSWORD: ${{ secrets.DATABASE_SSL_P12_PASSWORD || 'elloot' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-placeholder-jwt-secret-at-least-32-chars' }}
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET || 'ci-placeholder-admin-jwt-secret-32ch' }}
        run: npx tsx scripts/with-db-env.ts npx prisma db push

      - name: Apply visibility/media SQL (idempotent)
        env:
          NODE_ENV: development
          DATABASE_SSL_CERT_PATH: ./src/databases/postgres/certificates/certificate.pem
          DATABASE_SSL_P12_PASSWORD: ${{ secrets.DATABASE_SSL_P12_PASSWORD || 'elloot' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-placeholder-jwt-secret-at-least-32-chars' }}
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET || 'ci-placeholder-admin-jwt-secret-32ch' }}
        run: |
          npx tsx scripts/with-db-env.ts npx prisma db execute --file prisma/sql/029_media_public_codes.sql --schema prisma/schema.prisma
          npx tsx scripts/with-db-env.ts npx prisma db execute --file prisma/sql/032_create_visibility_tables.sql --schema prisma/schema.prisma
          npx tsx scripts/with-db-env.ts npx prisma db execute --file prisma/sql/030_visibility_home_sections.sql --schema prisma/schema.prisma
          npx tsx scripts/with-db-env.ts npx prisma db execute --file prisma/sql/031_home_sections_public_read.sql --schema prisma/schema.prisma
          npx tsx scripts/with-db-env.ts npx prisma db execute --file prisma/sql/033_listing_placements_seller_read.sql --schema prisma/schema.prisma
          npx tsx scripts/with-db-env.ts npx prisma db execute --file prisma/sql/034_visibility_queue_paid.sql --schema prisma/schema.prisma
          npx tsx scripts/with-db-env.ts npx prisma db execute --file prisma/sql/035_reviews_moderation.sql --schema prisma/schema.prisma
          npx tsx scripts/with-db-env.ts npx prisma db execute --file prisma/sql/036_product_types.sql --schema prisma/schema.prisma
          npx tsx scripts/with-db-env.ts npx prisma db execute --file prisma/sql/037_reach_plans.sql --schema prisma/schema.prisma

      - name: Apply RLS (db:secure)
        env:
          NODE_ENV: development
          DATABASE_SSL_CERT_PATH: ./src/databases/postgres/certificates/certificate.pem
          DATABASE_SSL_P12_PASSWORD: ${{ secrets.DATABASE_SSL_P12_PASSWORD || 'elloot' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-placeholder-jwt-secret-at-least-32-chars' }}
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET || 'ci-placeholder-admin-jwt-secret-32ch' }}
        run: npm run db:secure

      - name: Seed
        env:
          NODE_ENV: development
          DATABASE_SSL_CERT_PATH: ./src/databases/postgres/certificates/certificate.pem
          DATABASE_SSL_P12_PASSWORD: ${{ secrets.DATABASE_SSL_P12_PASSWORD || 'elloot' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-placeholder-jwt-secret-at-least-32-chars' }}
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET || 'ci-placeholder-admin-jwt-secret-32ch' }}
        run: npx tsx scripts/with-db-env.ts npx prisma db seed
        continue-on-error: true
